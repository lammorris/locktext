name: iOS — Build & Simulator Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test on a cloud Mac
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show the Xcode version on this runner
        run: xcodebuild -version

      - name: List available simulators (for the log)
        run: xcrun simctl list devices available | grep -E "iPhone" | head -10

      - name: Build the app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project StarterApp/StarterApp.xcodeproj \
            -scheme StarterApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run the tests on an iPhone simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project StarterApp/StarterApp.xcodeproj \
            -scheme StarterApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
